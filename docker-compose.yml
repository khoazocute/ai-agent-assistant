# Chạy thật: PostgreSQL + app (API + web + bot Telegram + job nền trong một tiến trình).
#   cp .env.example .env   # điền GEMINI_API_KEY, WEB_PASSWORD, JWT_SECRET, TELEGRAM_*, POSTGRES_PASSWORD
#   docker compose up -d --build
#   mở http://localhost:8000
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: assistant
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://assistant:${POSTGRES_PASSWORD}@db:5432/assistant
      TELEGRAM_MODE: ${TELEGRAM_MODE:-polling}
    ports:
      - "127.0.0.1:8000:8000"   # chỉ mở trên máy này; ra internet thì đặt sau reverse proxy có HTTPS
    volumes:
      - appdata:/app/backend/data   # trace JSONL, token Google (đã mã hoá)
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  appdata:
