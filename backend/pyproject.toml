[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-assistant"
version = "0.0.1"
description = "Trợ lý cá nhân multi-agent ReAct: chi tiêu, lịch, email"
requires-python = ">=3.11"
# Chỉ thêm thư viện khi bước tương ứng cần đến (xem PLAN.md → Lộ trình).
dependencies = [
    "google-genai",       # bước 1: gọi Gemini (ADR-0002)
    "pydantic>=2",        # bước 3: schema cho tool
    "pydantic-settings",  # cấu hình từ .env
    "python-dotenv",
    "sqlalchemy>=2",      # bước 4: DB (SQLite khi học, PostgreSQL khi chạy thật)
    "pyyaml",             # bước 5: ca eval (sau này: policies.yaml)
    "python-telegram-bot>=21",  # bước 12: bot Telegram (polling khi dev, webhook khi chạy thật)
    "fastapi",            # bước 13: web API
    "uvicorn[standard]",
    "pyjwt",              # bước 13: phiên đăng nhập web (cookie httpOnly)
    "apscheduler>=3.10,<4",  # bước 16: job nền (bản tin, nhắc lịch, đồng bộ, dọn dữ liệu)
    "python-multipart",   # bước 17: tải ảnh hóa đơn lên web
]

[project.optional-dependencies]
google = [                # bước 10, 15: Gmail + Google Calendar (OAuth)
    "google-api-python-client",
    "google-auth-oauthlib",
    "cryptography",       # mã hoá token OAuth (Fernet)
]
voice = [                 # bước 18: chuyển giọng nói → chữ NGAY TRÊN MÁY (ADR-0015)
    "faster-whisper",
]
dev = [
    "pytest>=8",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # để test import được package evals/

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dùng Depends(...) làm giá trị mặc định theo thiết kế — không phải lỗi B008.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]
