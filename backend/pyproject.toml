[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-assistant"
version = "0.0.1"
description = "Trợ lý cá nhân multi-agent ReAct: chi tiêu, lịch, email"
requires-python = ">=3.11"
# Chỉ thêm thư viện khi bước tương ứng cần đến (xem PLAN.md → Lộ trình).
dependencies = [
    "anthropic",          # bước 1: gọi Claude
    "pydantic>=2",        # bước 3: schema cho tool
    "pydantic-settings",  # cấu hình từ .env
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
